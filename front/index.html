<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影资料库</title>

<script>
(function () {
  const THEME_KEY = 'movie_theme';
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effective = saved === 'auto' ? (systemDark ? 'dark' : 'light') : saved;
  document.documentElement.setAttribute('data-theme', effective);
  document.documentElement.setAttribute('data-theme-mode', saved);
})();
</script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 左栏 · 电影库 ========== -->
<div class="library">
  <header class="masthead">
    <div>
      <div class="kicker">MOVIE ARCHIVE</div>
      <h1>电影资料库</h1>
      <div class="count" id="totalCount">加载中…</div>
    </div>
    <div class="masthead-side">
      <div class="masthead-actions">
        <button class="icon-btn" id="prefBtn" title="偏好设置" aria-label="偏好设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
            <circle cx="15" cy="7" r="2.2"/>
            <circle cx="9" cy="17" r="2.2"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题"></button>
      </div>

      <div class="sort-control">
        <select id="sortField" title="排序字段">
          <option value="default">默认排序</option>
          <option value="score">按评分</option>
          <option value="year">按年份</option>
          <option value="name">按名称</option>
        </select>
        <button class="sort-order-btn" id="sortOrderBtn" title="切换升序/降序">↓</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="field field-search search-wrapper">
      <input id="searchInput" placeholder="搜索电影名…" autocomplete="off" />
      <div class="search-history" id="searchHistory" hidden>
        <div class="search-history-header">
          <span>最近搜索</span>
          <button class="search-history-clear" id="searchHistoryClear">清空</button>
        </div>
        <ul class="search-history-list" id="searchHistoryList"></ul>
      </div>
    </div>

    <div class="field field-num">
      <input id="filterScore" type="number" placeholder="最低评分" min="0" max="10" step="0.1" />
    </div>
    <div class="field field-num">
      <input id="filterYear" type="number" placeholder="年份" min="1888" />
    </div>

    <button class="btn btn-primary" onclick="doSearch()">搜索 / 过滤</button>
    <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
    <button class="btn btn-success" onclick="openCreate()">+ 新增电影</button>
  </div>

  <div id="movieList" class="list"></div>
  <div id="emptyHint" class="empty">
    <div class="empty-title">没有找到电影</div>
    <div class="empty-sub">换个关键词，或放宽筛选条件试试</div>
  </div>

  <div class="pager">
    <button id="prevBtn" onclick="changePage(-1)">← 上一页</button>
    <span id="pageInfo">—</span>
    <button id="nextBtn" onclick="changePage(1)">下一页 →</button>
  </div>
</div>

<!-- ========== 右栏 · AI 助手 ========== -->
<aside class="chat">
  <div class="chat-header">
    <strong>AI 助手</strong>
    <div class="chat-sub"><span class="dot"></span>在线 · 可查资料 / 推荐影片</div>
  </div>

  <div id="chatMessages" class="chat-messages">
    <div class="msg ai">你好。可以让我推荐影片，或帮你查电影资料。</div>
  </div>

  <div class="quick-prompts" id="quickPrompts">
    <button class="quick-prompt-btn" data-prompt="推荐几部高分科幻电影">推荐高分科幻</button>
    <button class="quick-prompt-btn" data-prompt="有哪些 9 分以上的经典电影？">9 分以上的经典</button>
    <button class="quick-prompt-btn" data-prompt="我喜欢的类型是科幻，评分至少 8 分">我喜欢的类型</button>
    <button class="quick-prompt-btn" data-prompt="帮我挑一部适合周末看的电影">周末看什么</button>
  </div>

  <div class="chat-input">
    <textarea id="chatInput" rows="1" placeholder="输入你的问题…" title="Enter 发送，Shift + Enter 换行"></textarea>
    <button id="chatStopBtn" type="button" title="停止生成" hidden>停止</button>
    <button id="chatSendBtn" type="button" onclick="sendChat()">发送</button>
  </div>
</aside>

<!-- ========== 偏好设置 ========== -->
<div id="prefModal" class="modal" onclick="if(event.target===this)closePref()">
  <div class="pref-box">
    <div class="pref-header">
      <h2>偏好设置</h2>
      <button class="pref-close" onclick="closePref()" title="关闭">×</button>
    </div>
    <p class="pref-hint">告诉 AI 助手你的口味，推荐会更贴合你。</p>

    <label class="pref-field">
      <span class="pref-label">用户 ID</span>
      <input id="prefUserId" placeholder="如 user_001" />
    </label>

    <label class="pref-field">
      <span class="pref-label">喜欢的类型</span>
      <input id="prefFavoriteType" placeholder="如 科幻 / 悬疑 / 剧情" />
    </label>

    <label class="pref-field">
      <span class="pref-label">最低评分</span>
      <div class="pref-score-row">
        <input id="prefMinScore" type="range" min="0" max="10" step="0.1" />
        <span class="pref-score-value" id="prefMinScoreValue">7.0</span>
      </div>
    </label>

    <div class="pref-actions">
      <button class="btn btn-cancel" onclick="closePref()">取消</button>
      <button class="btn btn-primary" id="prefSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- ========== 新增 / 编辑 ========== -->
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" onkeydown="if(event.key==='Escape')closeModal(); if(event.key==='Enter'){event.preventDefault();submitModal();}">
    <div class="kicker">EDIT ENTRY</div>
    <h2 id="modalTitle">新增电影</h2>
    <input id="mName" placeholder="电影名" />
    <input id="mScore" type="number" placeholder="评分 (0-10)" min="0" max="10" step="0.1" />
    <input id="mYear" type="number" placeholder="年份" min="1888" />
    <input id="mType" placeholder="类型（如：剧情 / 科幻）" />
    <div class="row">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="submitModal()">保存</button>
    </div>
  </div>
</div>

<!-- ========== 电影详情 ========== -->
<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-box">
    <div class="kicker">条目详情</div>
    <h2 id="detailName">—</h2>
    <div class="detail-stats">
      <div class="stat">
        <div class="stat-label">评分</div>
        <div class="stat-value" id="detailScore">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">年份</div>
        <div class="stat-value" id="detailYear">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">类型</div>
        <div class="stat-value" id="detailType">—</div>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-ghost" onclick="closeDetail()">关闭</button>
      <button class="btn btn-primary" id="detailEditBtn">编辑</button>
    </div>
  </div>
</div>

<!-- ========== 确认 ========== -->
<div id="confirmModal" class="modal">
  <div class="confirm-box">
    <div class="icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">确认操作</h3>
    <p id="confirmMsg">确定要执行这个操作吗？</p>
    <div class="row">
      <button class="btn-cancel" id="confirmCancel">取消</button>
      <button class="btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="app.js" defer></script>
</body>
</html>
